name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer run on the same ref makes the older one pointless.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # The test file imports its kit from 'claude-code/testing', which the claude binary provides.
      # Pinned: the kit changes with the binary. No login or secret is needed (checked in a clean Linux container).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code@2.1.323
      - run: claude plugin test
